name: Qullamaggie Daily Scanner

on:
  schedule:
    # Primary: Mon–Fri 21:15 UTC (stagger after Strong 21:00) — after US close (EDT).
    # ~15m runtime; GH schedule delay 1–5h common. Earlier cron vs old 23:30 UTC
    # to aim for ExtraScan QQscan 10:00 JST / Sheet 11:00 JST — not a guarantee.
    - cron: "15 21 * * 1-5"
    # Backup: Tue–Sat 00:15 UTC ≈ 09:15 JST
    - cron: "15 0 * * 2-6"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Maggiestocks scan
        run: |
          set +e
          python scan.py
          set -e
      - name: Publish list + sidecar metadata
        id: publish
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "file=" >> "$GITHUB_OUTPUT"
          echo "meta=" >> "$GITHUB_OUTPUT"
          if ls Maggiestocks_*.txt 1> /dev/null 2>&1; then
            git add Maggiestocks_*.txt Maggiestocks_*.txt.meta.json || true
            if git diff --staged --quiet; then
              LATEST=$(ls -1 Maggiestocks_*.txt | sort | tail -1)
              echo "file=$LATEST" >> "$GITHUB_OUTPUT"
              META="${LATEST}.meta.json"
              if [ -f "$META" ]; then echo "meta=$META" >> "$GITHUB_OUTPUT"; fi
              echo "Maggiestocks already committed; nothing new to push."
            else
              git commit -m "更新今日 Maggiestocks 清單 + session metadata"
              git push
              LATEST=$(ls -1 Maggiestocks_*.txt | sort | tail -1)
              echo "file=$LATEST" >> "$GITHUB_OUTPUT"
              META="${LATEST}.meta.json"
              if [ -f "$META" ]; then echo "meta=$META" >> "$GITHUB_OUTPUT"; fi
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Published $LATEST (+ meta if present)"
            fi
          else
            echo "No Maggiestocks txt produced."
          fi
      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maggie-scan-out
          path: |
            Maggiestocks_*.txt
            Maggiestocks_*.txt.meta.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Trigger ExtraScan QQscan
        if: steps.publish.outputs.pushed == 'true'
        env:
          EXTRASCAN_DISPATCH_TOKEN: ${{ secrets.EXTRASCAN_DISPATCH_TOKEN }}
          MAGGIE_FILE: ${{ steps.publish.outputs.file }}
          DID_PUSH: ${{ steps.publish.outputs.pushed }}
        run: |
          set -euo pipefail
          if [ -z "${EXTRASCAN_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::EXTRASCAN_DISPATCH_TOKEN not set — ExtraScan relies on crons / SheetOps backup."
            exit 0
          fi
          BODY=$(jq -n --arg f "$MAGGIE_FILE" --argjson p true \
            '{event_type:"maggiestocks-updated",client_payload:{file:$f,pushed:$p,has_meta:true}}')
          HTTP=$(curl -sS -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${EXTRASCAN_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/philipriva/ExtraScan/dispatches \
            -d "$BODY")
          echo "repository_dispatch HTTP $HTTP"
          cat /tmp/dispatch_body.txt || true
          if [ "$HTTP" != "204" ]; then
            echo "::error::ExtraScan repository_dispatch failed (HTTP $HTTP)"
            exit 1
          fi
