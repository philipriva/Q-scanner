name: Qullamaggie Daily Scanner

on:
  schedule:
    # Daily (keep * * *). 33 1 * * * ≈ 10:33 JST every day, after Strong 09:53.
    - cron: '33 1 * * *'
    # Mid backups, offset from other full-universe Yahoo writers:
    # 14:18 JST; 17:38 JST. Skip if a success already exists for the latest US session.
    - cron: '18 5 * * *'
    - cron: '38 8 * * *'
    # Late backup 19:02 JST Tue–Sat (staggered 15:00 Yahoo ladder).
    - cron: "2 10 * * 2-6"
  workflow_dispatch: # 允許手動點擊執行

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: qullamaggie-daily-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: Skip if session already succeeded
      id: already
      if: github.event_name == 'schedule'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 skip_if_session_done.py --workflow scan.yml

    - name: 設定 Python 環境
      if: steps.already.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      if: steps.already.outputs.skip != 'true'
      run: |
        pip install -r requirements.txt

    - name: 執行 Qullamaggie 強勢股篩選
      if: steps.already.outputs.skip != 'true'
      run: |
        python scan.py

    - name: 自動將結果存回 GitHub 專案
      if: steps.already.outputs.skip != 'true'
      id: publish
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        echo "pushed=false" >> "$GITHUB_OUTPUT"
        echo "file=" >> "$GITHUB_OUTPUT"

        # 💡 關鍵修正：同步改為檢查並上傳 Maggiestocks_ 開頭的檔案！
        if ls Maggiestocks_*.txt 1> /dev/null 2>&1; then
          git add Maggiestocks_*.txt
          if git diff --staged --quiet; then
            echo "Maggiestocks txt already committed; nothing new to push."
            LATEST=$(ls -1 Maggiestocks_*.txt | sort | tail -1)
            echo "file=$LATEST" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新今日 Qullamaggie 強勢股清單 (Maggiestocks 版)"
            git push
            LATEST=$(ls -1 Maggiestocks_*.txt | sort | tail -1)
            echo "file=$LATEST" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Published $LATEST"
          fi
        else
          echo "今日未偵測到符合條件的股票，跳過上傳。"
        fi

    # Cross-repo: tell ExtraScan QQscan to pull newest Maggiestocks (+ Strong) into Sheet.
    # Requires Actions secret EXTRASCAN_DISPATCH_TOKEN (same fine-grained PAT as
    # my-stock-scanner: ExtraScan Contents Read and write for repository_dispatch).
    - name: Trigger ExtraScan QQscan
      if: steps.already.outputs.skip != 'true' && steps.publish.outputs.pushed == 'true'
      env:
        EXTRASCAN_DISPATCH_TOKEN: ${{ secrets.EXTRASCAN_DISPATCH_TOKEN }}
        MAGGIE_FILE: ${{ steps.publish.outputs.file }}
        DID_PUSH: ${{ steps.publish.outputs.pushed }}
      run: |
        set -euo pipefail
        if [ -z "${EXTRASCAN_DISPATCH_TOKEN:-}" ]; then
          echo "::warning::EXTRASCAN_DISPATCH_TOKEN not set on Q-scanner — ExtraScan QQscan relies on Strong dispatch wait / its own crons for Maggiestocks. Add the same fine-grained PAT used on my-stock-scanner (ExtraScan Contents: Read and write)."
          exit 0
        fi
        echo "Dispatching ExtraScan QQscan (file=$MAGGIE_FILE pushed=$DID_PUSH)…"
        BODY=$(jq -n --arg f "$MAGGIE_FILE" --argjson p "${DID_PUSH:-false}"           '{event_type:"maggiestocks-updated",client_payload:{file:$f,pushed:$p}}')
        HTTP=$(curl -sS -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST           -H "Accept: application/vnd.github+json"           -H "Authorization: Bearer ${EXTRASCAN_DISPATCH_TOKEN}"           -H "X-GitHub-Api-Version: 2022-11-28"           https://api.github.com/repos/philipriva/ExtraScan/dispatches           -d "$BODY")
        echo "repository_dispatch HTTP $HTTP"
        cat /tmp/dispatch_body.txt || true
        if [ "$HTTP" != "204" ]; then
          echo "::error::ExtraScan repository_dispatch failed (HTTP $HTTP). Check EXTRASCAN_DISPATCH_TOKEN scopes."
          exit 1
        fi
        echo "ExtraScan QQscan dispatch accepted."
